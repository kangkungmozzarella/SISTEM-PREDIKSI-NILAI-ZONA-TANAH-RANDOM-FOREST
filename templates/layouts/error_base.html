<!DOCTYPE html>
<html lang="id">
<head>
    {% include "layouts/_head.html" %}
    <title>{% block title %}{% endblock %} · Nilai Tanah Idi Rayeuk</title>
    <style>
        .error-page { min-height: 100vh; display: grid; place-items: center; padding: 24px var(--gutter); }
        .error-card { max-width: 440px; text-align: left; }
        .error-code { font-size: 0.85rem; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
    </style>
</head>
<body>
    <main class="error-page">
        <div class="error-card stack gap-md">
            <span class="error-code">Error {% block code %}{% endblock %}</span>
            <h1 style="font-size:1.6rem">{% block heading %}{% endblock %}</h1>
            <p class="muted">{% block message %}{% endblock %}</p>
            <div class="row gap-sm mt-sm">
                <a href="{{ url_for('homepage') }}" class="btn btn-primary"><i class="ph ph-house" aria-hidden="true"></i>Ke beranda</a>
                {% if is_logged_in %}
                <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Ke dashboard</a>
                {% endif %}
            </div>
        </div>
    </main>
</body>
</html>
